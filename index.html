<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>הארנק שלי</title>
<meta name="theme-color" content="#0b6b63">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="הארנק שלי">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1BVDe1-LxMy6rADSj9UJD8-6E5N2WnUxV=s192">
<link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1BVDe1-LxMy6rADSj9UJD8-6E5N2WnUxV=s180">
<style>
:root{
--bg:#f3f6f5; --surface:#ffffff; --surface2:#eef3f2; --text:#11211f; --muted:#5f716e; --line:#dde6e4;
--primary:#0b6b63; --primary2:#12a37f; --primary-soft:#dff3ee; --accent:#f2705e; --gold:#f2b632;
--danger:#e0483e; --danger-soft:#fde8e6; --warn:#c77d06; --warn-soft:#fdf1dc; --ok:#12915f;
--shadow:0 1px 2px rgba(10,40,36,.06),0 6px 20px rgba(10,40,36,.06);
--radius:20px; --tabbar:64px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){
:root:not([data-theme="light"]){
--bg:#0c1413; --surface:#141f1d; --surface2:#1b2826; --text:#e8f1ef; --muted:#93a6a2; --line:#24342f;
--primary:#2bc4a0; --primary2:#2bc4a0; --primary-soft:#123a33; --danger-soft:#3a1a18; --warn-soft:#3a2c12;
--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.25);
}
}
:root[data-theme="dark"]{
--bg:#0c1413; --surface:#141f1d; --surface2:#1b2826; --text:#e8f1ef; --muted:#93a6a2; --line:#24342f;
--primary:#2bc4a0; --primary2:#2bc4a0; --primary-soft:#123a33; --danger-soft:#3a1a18; --warn-soft:#3a2c12;
--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
font-family:"Heebo","Rubik",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow-x:hidden}
body{overscroll-behavior-y:contain}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--text)}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
.muted{color:var(--muted)}
.hidden{display:none!important}
/* App bar */
.appbar{position:sticky;top:0;z-index:20;padding:calc(var(--safe-t) + 10px) 16px 10px;
background:linear-gradient(135deg,#0a5f58,#0f8a6c 60%,#18a874);color:#fff}
.appbar-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.appbar h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.2px}
.month{display:flex;align-items:center;gap:2px;background:rgba(255,255,255,.16);border-radius:999px;padding:3px}
.month button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff}
.month button:active{background:rgba(255,255,255,.2)}
.month span{min-width:96px;text-align:center;font-weight:700;font-size:14px;white-space:nowrap}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;opacity:.95;margin-top:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#9be7c8;box-shadow:0 0 0 3px rgba(255,255,255,.15)}
.dot.saving{background:#ffd56b}.dot.error{background:#ff9b8f}.dot.local{background:#cfd8d6}
main{padding:14px 14px calc(var(--tabbar) + var(--safe-b) + 90px);max-width:720px;margin:0 auto}
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:15px;font-weight:800}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:18px 4px 8px}
.section-title h3{margin:0;font-size:15px;font-weight:800}
.link{color:var(--primary);font-weight:700;font-size:13px}
/* Hero */
.hero{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:118px;height:118px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .center{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .pct{font-size:24px;font-weight:800}
.ring .lbl{font-size:11px;color:var(--muted);margin-top:-2px}
.hero-stats{flex:1;display:grid;gap:8px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:22px;font-weight:800;line-height:1.15}
.stat .v.ok{color:var(--ok)}.stat .v.bad{color:var(--danger)}
.pills{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.pill{font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--primary-soft);color:var(--primary)}
/* Category progress rows */
.cat-row{display:flex;align-items:center;gap:12px;padding:10px 2px}
.cat-row+.cat-row{border-top:1px solid var(--line)}
.cat-ico{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:20px;flex:none}
.cat-main{flex:1;min-width:0}
.cat-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:7px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:99px}
.cat-amt{text-align:left;font-size:13px;flex:none}
.cat-amt b{font-size:15px}
/* Expense list */
.day{font-size:12px;font-weight:700;color:var(--muted);margin:14px 6px 6px}
.list{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.exp{position:relative;overflow:hidden}
.exp+.exp{border-top:1px solid var(--line)}
.exp-del{position:absolute;inset:0;background:var(--danger);color:#fff;display:flex;align-items:center;justify-content:flex-start;padding-inline-start:22px;font-weight:800}
.exp-fg{position:relative;background:var(--surface);display:flex;align-items:center;gap:12px;padding:12px 14px;transition:transform .2s ease;touch-action:pan-y}
.exp-fg.dragging{transition:none}
.exp-txt{flex:1;min-width:0}
.exp-note{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exp-meta{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.tag{font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--surface2)}
.tag.fixed{background:var(--primary-soft);color:var(--primary)}
.tag.one{background:var(--warn-soft);color:var(--warn)}
.exp-amt{font-weight:800;font-size:15px}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty .big{font-size:44px;margin-bottom:6px}
/* Search + chips */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:14px;padding:0 12px;box-shadow:var(--shadow);margin-bottom:10px}
.search input{flex:1;border:0;background:transparent;padding:12px 0;outline:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 12px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font-size:13px;font-weight:700;white-space:nowrap}
.chip.on{background:var(--primary);color:#fff}
.quick{display:flex;gap:8px;margin-bottom:12px}
.quick input{flex:1;border:1px dashed var(--line);background:var(--surface);border-radius:14px;padding:11px 12px;outline:none}
.quick button{background:var(--primary-soft);color:var(--primary);font-weight:800;border-radius:14px;padding:0 14px}
/* Category grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:14px;text-align:right}
.tile .cat-ico{width:38px;height:38px;font-size:19px;margin-bottom:8px}
.tile .t-name{font-weight:800;font-size:13px;min-height:34px;line-height:1.3}
.tile .t-amt{font-size:18px;font-weight:800;margin-top:4px}
.tile .t-of{font-size:12px;color:var(--muted)}
.tile.over{outline:2px solid var(--danger-soft)}
.tile.add{display:grid;place-items:center;border:2px dashed var(--line);box-shadow:none;background:transparent;color:var(--muted);font-weight:800;min-height:150px}
/* Settings */
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 2px;width:100%;text-align:right}
.set+.set{border-top:1px solid var(--line)}
.set .s-t{font-weight:700;font-size:14px}
.set .s-d{font-size:12px;color:var(--muted);margin-top:2px}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px}
.seg button{padding:6px 10px;border-radius:9px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
/* Trend */
.trend{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:8px}
.trend .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.trend .stack{width:100%;max-width:34px;display:flex;flex-direction:column-reverse;border-radius:8px;overflow:hidden;background:var(--surface2)}
.trend .lab{font-size:11px;color:var(--muted)}
.trend .col.cur .lab{color:var(--primary);font-weight:800}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:4px;vertical-align:-1px}
/* Insights */
.ins{display:flex;gap:10px;padding:10px 0}
.ins+.ins{border-top:1px solid var(--line)}
.ins .e{font-size:20px}
.ins .t{font-weight:700;font-size:14px}
.ins .d{font-size:12px;color:var(--muted);margin-top:2px}
/* Tab bar */
.tabbar{position:fixed;bottom:0;inset-inline:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;height:calc(var(--tabbar) + var(--safe-b));padding-bottom:var(--safe-b)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted)}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--primary)}
.fab{position:relative;top:-22px;justify-self:center;width:62px;height:62px;border-radius:50%;
background:linear-gradient(135deg,var(--accent),#f59b5c);color:#fff;display:grid;place-items:center;
box-shadow:0 8px 22px rgba(242,112,94,.45),0 0 0 6px var(--bg)}
.fab svg{width:30px;height:30px}
.fab:active{transform:scale(.95)}
/* Sheet */
.backdrop{position:fixed;inset:0;background:rgba(5,20,18,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.backdrop.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;inset-inline:0;bottom:0;z-index:50;background:var(--surface);border-radius:24px 24px 0 0;
max-height:92vh;overflow-y:auto;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
padding:8px 16px calc(18px + var(--safe-b));max-width:720px;margin:0 auto}
.sheet.show{transform:translateY(0)}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet h3{margin:0 0 12px;font-size:18px;font-weight:800}
.amount{display:flex;align-items:center;justify-content:center;gap:6px;margin:6px 0 14px}
.amount span{font-size:30px;font-weight:800;color:var(--muted)}
.amount input{width:70%;border:0;background:transparent;text-align:center;font-size:44px;font-weight:800;outline:none;direction:ltr;color:var(--text)}
.field{display:block;margin-bottom:12px}
.field .l{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;display:block}
.field input,.field select{width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:14px;padding:12px;outline:none}
.field input:focus{border-color:var(--primary)}
.catpick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.catpick button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:14px;background:var(--surface2);font-size:11px;font-weight:700;line-height:1.2;text-align:center;border:2px solid transparent}
.catpick button .em{font-size:22px}
.catpick button.on{border-color:var(--primary);background:var(--primary-soft)}
.toggles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.tg{padding:12px;border-radius:14px;background:var(--surface2);font-weight:700;font-size:13px;text-align:center;border:2px solid transparent}
.tg.on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.tg.on.one{border-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
.btn{width:100%;padding:15px;border-radius:16px;background:var(--primary);color:#fff;font-weight:800;font-size:16px}
.btn.secondary{background:var(--surface2);color:var(--text)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btns{display:grid;gap:8px;margin-top:6px}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-bottom:12px}
.emojis button{font-size:22px;padding:6px 0;border-radius:10px;background:var(--surface2);border:2px solid transparent}
.emojis button.on{border-color:var(--primary)}
.switch{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:right .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--primary)}
.switch.on::after{right:21px}
/* Toast */
.toast{position:fixed;left:50%;bottom:calc(var(--tabbar) + var(--safe-b) + 26px);transform:translateX(-50%) translateY(20px);
background:#11211f;color:#fff;padding:11px 16px;border-radius:14px;font-weight:700;font-size:14px;z-index:60;opacity:0;transition:.25s;max-width:90vw;display:flex;gap:12px;align-items:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast button{color:#7ee0c4;font-weight:800}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:16px;padding:12px 14px;font-size:13px;font-weight:700;margin-bottom:12px;display:flex;gap:10px;align-items:center}
@media (min-width:760px){
main{padding-top:22px}
.grid{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>

<button class="tab" data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>הגדרות</button>
</nav>
<div class="backdrop" id="backdrop"></div>

<div class="toast" id="toast"></div>
<script>
'use strict';
/* ================= Utils ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => '₪' + Math.round(Number(n) || 0).toLocaleString('he-IL');
const fmt2 = n => '₪' + (Number(n) || 0).toLocaleString('he-IL', {maximumFractionDigits: 2});
const MONTHS = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const MSHORT = ['ינו׳','פבר׳','מרץ','אפר׳','מאי','יוני','יולי','אוג׳','ספט׳','אוק׳','נוב׳','דצמ׳'];
const ymOf = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
const ymAdd = (ym, n) => { const [y, m] = ym.split('-').map(Number); return ymOf(new Date(y, m - 1 + n, 1)); };
const ymLabel = ym => { const [y, m] = ym.split('-').map(Number); return MONTHS[m - 1] + ' ' + y; };
const uid = () => 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const todayISO = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const lsDel = k => { try { localStorage.removeItem(k); } catch (e) {} };
/* ================= Data ================= */
const CACHE_KEY = 'wallet_pwa_data_v1';
const CFG_KEY = 'wallet_pwa_cfg_v1';
const UI_KEY = 'wallet_pwa_ui_v1';
const DEFAULT_CATEGORIES = [
{id:'groceries',name:'אוכל וקניות לבית',group:'יום-יום',icon:'🛒',color:'#10b981',active:true,budget:0,isFixedDefault:false},

/* ================= Calculations ================= */
const monthList = ym => (data.expensesByMonth[ym] || []);
const catById = id => data.categories.find(c => c.id === id) || {id, name:'אחר', icon:'📌', color:'#64748b'};
const sum = arr => arr.reduce((a, e) => a + (Number(e.amount) || 0), 0);
function monthStats(ym){
const list = monthList(ym);
const regular = list.filter(e => !e.isOneTime), one = list.filter(e => e.isOneTime);
const byCat = {}; regular.forEach(e => byCat[e.catId] = (byCat[e.catId] || 0) + (Number(e.amount) || 0));
return {list, total: sum(list), regular: sum(regular), oneTime: sum(one), fixed: sum(list.filter(e => e.isFixed && !e.isOneTime)), byCat};
}
function catAverages(ym){
const prev = Object.keys(data.expensesByMonth).filter(k => k < ym && monthList(k).length).sort().slice(-6);
const acc = {}, cnt = {};
prev.forEach(k => { const s = monthStats(k).byCat; Object.keys(s).forEach(c => { acc[c] = (acc[c] || 0) + s[c]; cnt[c] = (cnt[c] || 0) + 1; }); });
const avg = {}; Object.keys(acc).forEach(c => avg[c] = acc[c] / cnt[c]);
const totals = prev.map(k => monthStats(k).regular);
return {avg, overall: totals.length ? totals.reduce((a,b)=>a+b,0) / totals.length : 0, months: prev.length};
}

function bindSwipe(row){
const fg = row.querySelector('.exp-fg'); let x0 = 0, y0 = 0, dx = 0, drag = false, decided = false;
const id = row.dataset.id;
fg.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dx = 0; drag = false; decided = false; }, {passive:true});
fg.addEventListener('touchmove', e => {
const mx = e.touches[0].clientX - x0, my = e.touches[0].clientY - y0;
if (!decided) { if (Math.abs(mx) > 8 || Math.abs(my) > 8) { decided = true; drag = Math.abs(mx) > Math.abs(my) && mx > 0; } }
if (drag) { dx = Math.max(0, mx); fg.classList.add('dragging'); fg.style.transform = `translateX(${dx}px)`; }
}, {passive:true});
fg.addEventListener('touchend', () => {
fg.classList.remove('dragging');
if (drag && dx > row.offsetWidth * 0.35) { fg.style.transform = `translateX(${row.offsetWidth}px)`; setTimeout(() => deleteExpense(id), 180); }
else fg.style.transform = '';
setTimeout(() => { drag = false; }, 50);
});

}

commit(); toast('ההוצאה נמחקה', 'ביטול', () => { if (undoBuf) { (data.expensesByMonth[undoBuf.ym] = data.expensesByMonth[undoBuf.ym] || []).splice(undoBuf.i, 0, undoBuf.e); undoBuf = null; commit(); } });

function quickAdd(text){

const Sync = {
timer: null, busy: false, pending: false, ready: false,
status(s){ const d = $('#syncDot'), t = $('#syncText'); d.className = 'dot ' + (s === 'ok' ? '' : s);
t.textContent = {ok:'מסונכרן עם הגיליון שלך', saving:'שומר…', loading:'טוען…', error:'אין חיבור – יסונכרן כשיחזור', local: data && data.demo ? 'מצב תצוגה – לא מחובר' : 'שמור במכשיר בלבד'}[s] || ''; },
async call(payload){
const r = await fetch(cfg.apiUrl, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(Object.assign({key: cfg.apiKey}, payload))});
const j = await r.json(); if (j.error) throw new Error(j.error); return j;
},
schedule(){ if (!isConnected()) { this.status('local'); return; } this.status('saving'); clearTimeout(this.timer); this.timer = setTimeout(() => { this.timer = null; this.push(); }, 600); },
async push(){
if (!isConnected() || !this.ready) return;
if (this.busy) { this.pending = true; return; }
this.busy = true;
try {
const payload = Object.assign({}, data); delete payload.demo;
const j = await this.call({action:'save', data: JSON.stringify(payload)});
this.busy = false;
if (j.result === 'stale') { this.pending = false; return this.pull(false); }
if (this.pending) { this.pending = false; return this.push(); }
this.status('ok');
} catch (e) { this.busy = false; this.status('error'); setTimeout(() => this.push(), 15000); }
},
async pull(manual){
if (!isConnected() || this.busy || this.timer || this.pending) return;
if (manual) this.status('loading');
try {
const j = await this.call({action:'load'});
const remote = j.data ? normalize(JSON.parse(j.data)) : null;
this.ready = true;
if (!remote) { if (!data.updatedAt) data.updatedAt = Date.now(); writeCache(); return this.push(); }
if (remote.updatedAt > (data.updatedAt || 0)) { data = remote; writeCache(); render(); }
else if (remote.updatedAt < (data.updatedAt || 0)) return this.push();
this.status('ok'); if (manual) toast('מסונכרן');
} catch (e) { this.status('error'); }
}
};
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') Sync.pull(false); });
window.addEventListener('online', () => { if (isConnected()) Sync.push(); });
setInterval(() => { if (document.visibilityState === 'visible') Sync.pull(false); }, 60000);
/* ================= Boot ================= */
loadLocal(); applyTheme(); Sync.ready = isConnected() && data.updatedAt > 0;
// one-time setup link: .../#setup=<code>
if (location.hash.startsWith('#setup=')) { const code = decodeURIComponent(location.hash.slice(7)); history.replaceState(null, '', location.pathname); applySetupCode(code); }
render();
if (isConnected()) { Sync.status('loading'); Sync.pull(true); } else Sync.status('local');
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
